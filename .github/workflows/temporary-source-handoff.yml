name: Temporary source ZIP handoff
on:
  push:
    branches:
      - chatbot-merge-temp-20261015
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archives
        run: |
          test -s chat-BOT-v4.0.1-standard.zip
          test -s chat_BOT_v8.0.0_simple_fixed.zip
          unzip -t chat-BOT-v4.0.1-standard.zip
          unzip -t chat_BOT_v8.0.0_simple_fixed.zip
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-source-zips
          path: |
            chat-BOT-v4.0.1-standard.zip
            chat_BOT_v8.0.0_simple_fixed.zip
          if-no-files-found: error
          retention-days: 1
