name: Temporary ChatBOT v9.20.31 source handoff
on:
  push:
    branches:
      - tmp-chatbot-v92031-source-handoff-20261104
permissions:
  contents: read
jobs:
  source-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and safely inspect the exact requested archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/bottestprog-design/import/main/ChatBOT_v9.20.31_VOICE_ACCESS_FIX_V11.zip" \
            --output handoff/ChatBOT_v9.20.31_VOICE_ACCESS_FIX_V11.zip
          test -s handoff/ChatBOT_v9.20.31_VOICE_ACCESS_FIX_V11.zip
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path("handoff/ChatBOT_v9.20.31_VOICE_ACCESS_FIX_V11.zip")
          target = Path("handoff/source")
          target.mkdir(parents=True, exist_ok=True)

          max_files = 20000
          max_uncompressed = 500 * 1024 * 1024
          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              if not entries or len(entries) > max_files:
                  raise SystemExit(f"Unexpected archive entry count: {len(entries)}")
              total = sum(i.file_size for i in entries)
              if total > max_uncompressed:
                  raise SystemExit(f"Archive expands beyond safety limit: {total}")
              for item in entries:
                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  mode = item.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename!r}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink entry is not allowed: {item.filename!r}")
              zf.extractall(target)
          print(f"Validated {len(entries)} entries; extracted {total} bytes.")
          PY
          sha256sum handoff/ChatBOT_v9.20.31_VOICE_ACCESS_FIX_V11.zip
          find handoff/source -type f | sort | head -200
      - name: Upload source for local engineering review
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-v92031-source-handoff
          path: |
            handoff/ChatBOT_v9.20.31_VOICE_ACCESS_FIX_V11.zip
            handoff/source/
          if-no-files-found: error
          retention-days: 1
