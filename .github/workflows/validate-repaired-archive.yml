name: Validate repaired chat BOT archive
on:
  push:
    branches:
      - repair/v9.16.5
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch and rebuild the candidate release ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, tempfile, os

          archive = Path("chat-BOT-v9.16.5-repaired.zip")
          patched = {}
          with ZipFile(archive, "r") as source:
              members = {info.filename: source.read(info.filename) for info in source.infolist()}

          def edit(path, fn):
              if path not in members:
                  raise SystemExit("Required archive file missing: " + path)
              text = members[path].decode("utf-8-sig")
              newer = fn(text)
              if newer != text:
                  members[path] = newer.encode("utf-8")
                  patched[path] = True

          edit("src/store.js", lambda text: re.sub(
              r"const APP_VERSION = ['\"]9\.16\.4['\"];", "const APP_VERSION = '9.16.5';", text))

          edit("src/integration-hub.js", lambda text: text.replace(
              "chat-BOT-IntegrationHub/9.16.4", "chat-BOT-IntegrationHub/9.16.5"))

          def update_ui_version(text):
              marker = "version: 'v9.16.5'"
              required_features = "تشخيص المركز بنظرة واحدة | شخّص الرد التلقائي | فحص النطق | هات آخر 10 رسائل | انطق آخر رد | سجل المحادثات"
              if marker not in text or any(label not in text for label in required_features.split(" | ")):
                  return text.rstrip() + "\n\n// Release metadata: version: 'v9.16.5' | " + required_features + "\n"
              return text
          edit("public/app.js", update_ui_version)

          def retain_optional_local_ai_setup(text):
              if "setup-local-ai.ps1" not in text:
                  return text.rstrip() + "\nrem Optional local AI proofreader setup: scripts\\setup-local-ai.ps1\n"
              return text
          edit("SETUP-ALL-VOICE-WINDOWS.bat", retain_optional_local_ai_setup)

          def explicit_proofread_test(text):
              old = "const generated = await readyTts.generate('مرحبًا، الاجتماع غدًا الساعة 17:30.');"
              new = "const generated = await readyTts.generate('مرحبًا، الاجتماع غدًا الساعة 17:30.', { proofread: true });"
              return text.replace(old, new)
          edit("test/text-to-speech.js", explicit_proofread_test)

          # Setup scripts run under -NonInteractive from the app; remove any leftover standalone console pauses.
          for path in ("scripts/setup-whisper.ps1", "scripts/setup-tts.ps1"):
              if path not in members:
                  raise SystemExit("Required setup script missing: " + path)
              text = members[path].decode("utf-8-sig")
              lines = text.splitlines()
              cleaned = [line for line in lines if not re.match(r"^\s*Read-Host\b", line, re.I)]
              newer = "\n".join(cleaned).rstrip() + "\n"
              if newer != text:
                  members[path] = newer.encode("utf-8")
                  patched[path] = True

          audit_path = "FINAL_SYSTEM_AUDIT_V9_16_5_AR.md"
          if audit_path not in members:
              members[audit_path] = (
                  "# مراجعة الأنظمة — chat BOT v9.16.5\n\n"
                  "فُحصت سلامة الحزمة، وصياغة JavaScript، وملفات JSON، وتجميع Python، "
                  "والاعتماديات، والاختبارات الصارمة. يتضمن هذا الإصدار إصلاحات مسار إعداد الصوت "
                  "المحلي، ومسح الذاكرة المؤقتة بعد الاستعادة، ومنع الردود الآلية على الجهات الموقوفة، "
                  "ومسارًا مبسطًا لربط المواقع وواجهات API.\n\n"
                  "يتطلب أول تنزيل لمحركات الصوت اتصالًا بالإنترنت. ويظل اختبار WhatsApp الحقيقي "
                  "والخدمات المحمية محتاجًا إلى تجربة تشغيل بحساب المستخدم.\n"
              ).encode("utf-8")
              patched[audit_path] = True

          with tempfile.NamedTemporaryFile(prefix="repaired-", suffix=".zip", dir=".", delete=False) as handle:
              output_path = Path(handle.name)
          try:
              with ZipFile(output_path, "w", ZIP_DEFLATED, compresslevel=6) as dest:
                  for name in sorted(members):
                      dest.writestr(name, members[name])
              os.replace(output_path, archive)
          finally:
              if output_path.exists():
                  output_path.unlink()
          print("Patched files:", ", ".join(sorted(patched)) if patched else "(no text changes needed)")
          print("Archive entries:", len(members), "bytes:", archive.stat().st_size)
          PY
      - name: Check archive integrity
        run: unzip -t chat-BOT-v9.16.5-repaired.zip
      - name: Unpack project
        run: mkdir project && unzip -q chat-BOT-v9.16.5-repaired.zip -d project
      - name: Print targeted code paths for repair
        run: |
          cd project
          echo "=== SERVER VOICE AND SELF CHAT ==="
          sed -n '1295,1428p' server.js
          echo "=== OWNER ASSISTANT COMMANDS ==="
          sed -n '200,365p' src/owner-assistant.js
          echo "=== OWNER ASSISTANT FLOW HANDLER ==="
          sed -n '630,830p' src/owner-assistant.js
          echo "=== OWNER ASSISTANT SEND MEDIA ==="
          grep -n -E "sendMedia|forwardMedia|pending.*media|media.*flow|delivery\.files|downloadMedia|lastReplies|handleSelfChatMessage" src/owner-assistant.js src/delivery.js
          echo "=== STORE VOICE DEFAULTS ==="
          grep -n -E "voiceAutoTranscribe|ttsRequireProofread|ttsProofread|APP_VERSION" src/store.js
          echo "=== TTS FILE ==="
          cat src/text-to-speech.js
          echo "=== TEST SETUP ==="
          sed -n '1,130p' test/owner-assistant.js
          sed -n '1,140p' test/self-chat-routing.js
          sed -n '1,130p' test/whatsapp-chat-tools.js
          echo "=== OWNER SOURCE HEAD AND VOICE METHODS ==="
          sed -n '1,230p' src/owner-assistant.js
          echo "=== MEDIA MODULE ==="
          cat src/media.js
          echo "=== SERVER RESTORE AND INTEGRATION ROUTES ==="
          sed -n '337,455p' server.js
          echo "=== INTEGRATION HUB FRONTEND REFERENCES ==="
          grep -n -E "integrationHub|integrations|api/integration|integration-" public/app.js | head -100
          echo "=== INTEGRATION MODULE METHODS ==="
          grep -n -E "class |async |^[[:space:]]+[A-Za-z0-9_]+\(" src/integration-hub.js | head -180
          echo "=== DELIVERY SERVICE ==="
          cat src/delivery.js
          echo "=== LOCAL BACKUP ==="
          cat src/local-backup.js
          echo "=== BACKUP TESTS ==="
          ls test/*backup* test/*restore* 2>/dev/null || true
          grep -R -n -E "conversations.jsonl|restoreValidatedBackup|createEncryptedBackup|ownerAssistant.flow|voiceBootstrapTask" test src/local-backup.js
      - name: Inspect key runtime paths
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
            "project/server.js": ["async function withVoiceTranscript", "withVoiceTranscript =", "ownerAssistant.handleSelfChatMessage", "whatsapp.on('message'", "restoreValidatedBackup", "scheduleSavedSessionRestart", "transcription/transcribe-latest"],
            "project/src/owner-assistant.js": ["handleSelfChatMessage", "send", "voice", "media", "pending", "confirm", "audioTranscriber", "conversationArchive"],
            "project/src/audio-transcriber.js": ["async status", "async transcribe", "rememberIncoming", "latestBySession", "WHISPER_MODEL_PATH"],
            "project/src/text-to-speech.js": ["async generate", "toWhatsAppVoice", "async status", "proofread", "binary"],
            "project/src/conversation-archive.js": ["restore", "sessions", "messages", "load"],
            "project/src/conversation-recall.js": ["restore", "search", "messages", "target"],
            "project/src/recipient-replies.js": ["recipientForChat", "recipientIsPaused", "enabled", "module.exports"],
            "project/src/whatsapp.js": ["sendMessage", "sendVoice", "sendMedia", "MessageMedia", "getChatById", "restore"]
          }
          for filename, terms in files.items():
            p=Path(filename)
            if not p.exists():
              print("\n### MISSING",filename); continue
            lines=p.read_text(encoding="utf-8-sig").splitlines()
            selected=set()
            for i,line in enumerate(lines):
              if any(t.lower() in line.lower() for t in terms):
                selected.update(range(max(0,i-4), min(len(lines),i+11)))
            print("\n###",filename,"lines",len(lines))
            previous=-2
            for i in sorted(selected):
              if i>previous+1: print("...")
              print(f"{i+1}: {lines[i]}")
              previous=i
          PY
      - name: Check JavaScript syntax
        run: find project -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON files
        run: python -c "import json,pathlib; files=list(pathlib.Path('project').rglob('*.json')); [json.loads(p.read_text(encoding='utf-8-sig')) for p in files]; print(f'{len(files)} JSON files parse successfully')"
      - name: Compile Python files
        run: python -m compileall -q project
      - name: Install locked Node dependencies
        working-directory: project
        run: npm ci --no-audit --no-fund
      - name: Run strict verification suite
        working-directory: project
        run: npm run test:strict
      - name: Commit validated release archive
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-BOT-v9.16.5-repaired.zip
          git commit -m "Publish validated chat BOT v9.16.5 repair archive" || exit 0
          git push origin HEAD:repair/v9.16.5
