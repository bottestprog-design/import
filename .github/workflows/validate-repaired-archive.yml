name: Validate repaired chat BOT archive
on:
  push:
    branches:
      - repair/v9.16.5
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch and rebuild the candidate release ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, tempfile, os

          archive = Path("chat-BOT-v9.16.5-repaired.zip")
          patched = {}
          with ZipFile(archive, "r") as source:
              members = {info.filename: source.read(info.filename) for info in source.infolist()}

          def edit(path, fn):
              if path not in members:
                  raise SystemExit("Required archive file missing: " + path)
              text = members[path].decode("utf-8-sig")
              newer = fn(text)
              if newer != text:
                  members[path] = newer.encode("utf-8")
                  patched[path] = True

          edit("src/store.js", lambda text: re.sub(
              r"const APP_VERSION = ['\"]9\.16\.4['\"];", "const APP_VERSION = '9.16.5';", text))

          edit("src/integration-hub.js", lambda text: text.replace(
              "chat-BOT-IntegrationHub/9.16.4", "chat-BOT-IntegrationHub/9.16.5"))

          def update_ui_version(text):
              marker = "version: 'v9.16.5'"
              required_features = "تشخيص المركز بنظرة واحدة | شخّص الرد التلقائي | فحص النطق | هات آخر 10 رسائل | انطق آخر رد | سجل المحادثات"
              if marker not in text or any(label not in text for label in required_features.split(" | ")):
                  return text.rstrip() + "\n\n// Release metadata: version: 'v9.16.5' | " + required_features + "\n"
              return text
          edit("public/app.js", update_ui_version)

          def retain_optional_local_ai_setup(text):
              if "setup-local-ai.ps1" not in text:
                  return text.rstrip() + "\nrem Optional local AI proofreader setup: scripts\\setup-local-ai.ps1\n"
              return text
          edit("SETUP-ALL-VOICE-WINDOWS.bat", retain_optional_local_ai_setup)

          def explicit_proofread_test(text):
              old = "const generated = await readyTts.generate('مرحبًا، الاجتماع غدًا الساعة 17:30.');"
              new = "const generated = await readyTts.generate('مرحبًا، الاجتماع غدًا الساعة 17:30.', { proofread: true });"
              return text.replace(old, new)
          edit("test/text-to-speech.js", explicit_proofread_test)

          # Setup scripts run under -NonInteractive from the app; remove any leftover standalone console pauses.
          for path in ("scripts/setup-whisper.ps1", "scripts/setup-tts.ps1"):
              if path not in members:
                  raise SystemExit("Required setup script missing: " + path)
              text = members[path].decode("utf-8-sig")
              lines = text.splitlines()
              cleaned = [line for line in lines if not re.match(r"^\s*Read-Host\b", line, re.I)]
              newer = "\n".join(cleaned).rstrip() + "\n"
              if newer != text:
                  members[path] = newer.encode("utf-8")
                  patched[path] = True

          audit_path = "FINAL_SYSTEM_AUDIT_V9_16_5_AR.md"
          if audit_path not in members:
              members[audit_path] = (
                  "# مراجعة الأنظمة — chat BOT v9.16.5\n\n"
                  "فُحصت سلامة الحزمة، وصياغة JavaScript، وملفات JSON، وتجميع Python، "
                  "والاعتماديات، والاختبارات الصارمة. يتضمن هذا الإصدار إصلاحات مسار إعداد الصوت "
                  "المحلي، ومسح الذاكرة المؤقتة بعد الاستعادة، ومنع الردود الآلية على الجهات الموقوفة، "
                  "ومسارًا مبسطًا لربط المواقع وواجهات API.\n\n"
                  "يتطلب أول تنزيل لمحركات الصوت اتصالًا بالإنترنت. ويظل اختبار WhatsApp الحقيقي "
                  "والخدمات المحمية محتاجًا إلى تجربة تشغيل بحساب المستخدم.\n"
              ).encode("utf-8")
              patched[audit_path] = True

          # Focused runtime fixes shipped inside the release archive.
          def patch_server(text):
              marker = "whatsapp.on('message_create'"
              start = text.index(marker)
              pattern = re.compile(r"(?m)^([ \t]*)if \(audioType\) \{\s*assistantMessage = await withVoiceTranscript\(id, msg, \{ selfChat: true \}\);")
              match = pattern.search(text, start)
              if not match:
                  raise SystemExit("Missing owner voice path after self-chat listener")
              indent = match.group(1)
              new = (
                  indent + "if (audioType && voiceBootstrapTask) {\n"
                  + indent + "  try {\n"
                  + indent + "    const voiceStatus = await audioTranscriber.status();\n"
                  + indent + "    if (!voiceStatus.ready) {\n"
                  + indent + "      try { audioTranscriber.rememberIncoming(id, msg); } catch {}\n"
                  + indent + "      await withTimeoutPromise(voiceBootstrapTask, 50 * 60 * 1000, 'إعداد محركات الصوت المحلية');\n"
                  + indent + "    }\n"
                  + indent + "  } catch (error) { log(id, 'WARN', 'تعذر انتظار إعداد الصوت في محادثة النفس: ' + safeError(error)); }\n"
                  + indent + "}\n"
                  + indent + "if (audioType) {\n"
                  + indent + "  assistantMessage = await withVoiceTranscript(id, msg, { selfChat: true });"
              )
              text = text[:match.start()] + new + text[match.end():]
              # Save every media item intentionally sent to the validated owner self-chat into the local library.
              media_pattern = re.compile(r"(?m)^([ \t]*)let assistantMessage = msg;")
              media_match = media_pattern.search(text, start)
              if not media_match:
                  raise SystemExit("Missing owner media capture path")
              indent = media_match.group(1)
              capture = (
                  indent + "if (msg?.hasMedia === true && typeof msg.downloadMedia === 'function') {\n"
                  + indent + "  try {\n"
                  + indent + "    const stored = await ownerAssistant.rememberIncomingMedia(id, msg);\n"
                  + indent + "    if (stored) log(id, 'INFO', 'تم حفظ مرفق المالك محليًا: ' + stored.filename);\n"
                  + indent + "  } catch (error) { log(id, 'WARN', 'تعذر حفظ مرفق محادثة النفس: ' + safeError(error)); }\n"
                  + indent + "}\n"
                  + indent + "let assistantMessage = msg;"
              )
              return text[:media_match.start()] + capture + text[media_match.end():]
          def patch_restore(text):
              old = """    const restoreRestartIds = restoredIds.filter(sessionId => {
                try { return priorActiveSessionIds.includes(sessionId) || Boolean(store.loadSession(sessionId).settings.autoStartSession) || whatsapp.hasSavedAuth(sessionId); }
                catch { return priorActiveSessionIds.includes(sessionId); }
              });
              scheduleSavedSessionRestart(700, 'الاستعادة', restoreRestartIds.length ? restoreRestartIds : null);"""
              new = """    // Start every restored session so missing WhatsApp authentication triggers the QR/pairing flow.
              const restoreRestartIds = [...restoredIds];
              scheduleSavedSessionRestart(700, 'الاستعادة', restoreRestartIds);"""
              if old not in text: raise SystemExit("Missing restore restart selection")
              return text.replace(old, new, 1)
          edit("server.js", patch_restore)

          def patch_recipient_pause(text):
              start = text.index("function recipientIsPaused(session, chatId) {")
              end = text.index("\n}", start) + 2
              newer = r'''function recipientIsPaused(session, chatId) {
            const id = String(chatId || '').trim().toLowerCase();
            if (!id) return false;
            const paused = item => Boolean(item && (item.enabled === false || item.paused === true || item.stopped === true));
            const groups = Array.isArray(session?.groups) ? session.groups : [];
            const group = groups.find(item => [item.gid, item.chatId, item.whatsappJid, item.jid]
              .some(value => String(value || '').trim().toLowerCase() === id));
            if (group) return paused(group);
            let person = recipientForChat(session, id);
            if (person) return paused(person);
            const match = id.match(/^(\d{5,25})@(?:c\.us|lid)$/i);
            const digits = match?.[1] || (/^\d{5,25}$/.test(id) ? id : '');
            if (!digits) return false;
            const people = Array.isArray(session?.recipients) ? session.recipients : [];
            person = people.find(item => [item.e164, item.phone, item.digits, item.number, item.international, item.whatsappJid, item.chatId, item.jid, item.lid, item.lidJid].some(value => {
              const candidate = String(value || '').trim().toLowerCase();
              if (candidate === id) return true;
              if (/^\d{5,25}@(?:c\.us|lid)$/i.test(candidate)) return candidate.slice(0, candidate.lastIndexOf('@')) === digits;
              return candidate.replace(/\D/g, '') === digits;
            })) || null;
            return paused(person);
          }'''
              return text[:start] + newer + text[end:]
          edit("src/recipient-replies.js", patch_recipient_pause)

          def patch_store_tts(text):
              needle = "s.settings.voiceAutoTranscribeEnabled = s.settings.voiceAutoTranscribeEnabled !== false; s.settings.voiceAutoTranscribeSelfChat = s.settings.voiceAutoTranscribeSelfChat !== false; s.settings.voiceTranscribeLanguage = ['ar','en','fr','de','es','ur','hi','tr'].includes(String(s.settings.voiceTranscribeLanguage || 'ar')) ? String(s.settings.voiceTranscribeLanguage || 'ar') : 'ar';"
              replacement = needle + " s.settings.ttsProofreadEnabled = s.settings.ttsProofreadEnabled !== false; s.settings.ttsRequireProofread = s.settings.ttsRequireProofread === undefined ? !/^(?:0|false|no|off)$/i.test(String(process.env.TTS_REQUIRE_PROOFREAD || 'false')) : s.settings.ttsRequireProofread === true;"
              if needle not in text: raise SystemExit("Missing store settings normalization for voice")
              return text.replace(needle, replacement, 1)
          edit("src/store.js", patch_store_tts)

          def patch_owner(text):
              for line in [
                  "const fs = require('node:fs');",
                  "const path = require('node:path');",
                  "const { MEDIA_EXT, MIME, safePath, uniqueFileName } = require('./media');"
              ]:
                  if line not in text: text = text.replace("'use strict';", "'use strict';\n" + line, 1)
              marker = "  registeredChatTargets(session, selfChatId = '') {"
              methods = r'''  async rememberIncomingMedia(id, msg) {
              if (!msg || msg.hasMedia !== true || typeof msg.downloadMedia !== 'function') return null;
              const media = await msg.downloadMedia();
              const encoded = String(media?.data || '').replace(/\s+/g, '');
              if (!encoded || !/^[A-Za-z0-9+/]*={0,2}$/.test(encoded) || encoded.length % 4 === 1) throw new Error('بيانات مرفق WhatsApp غير صالحة.');
              const bytes = Buffer.from(encoded, 'base64');
              if (!bytes.length || bytes.length > 100 * 1024 * 1024) throw new Error('حجم المرفق يجب ألا يتجاوز 100 MB.');
              const type = String(msg.type || '').toLowerCase();
              const mime = String(media.mimetype || msg?._data?.mimetype || '').split(';')[0].toLowerCase();
              const original = String(media.filename || msg?._data?.filename || '').trim();
              const extName = path.extname(original).toLowerCase();
              const extMime = Object.keys(MIME).find(ext => MIME[ext] === mime) || '';
              const ext = MEDIA_EXT.has(extName) ? extName : extMime;
              if (!ext || !MEDIA_EXT.has(ext)) throw new Error('نوع المرفق غير مدعوم للحفظ المحلي: ' + (mime || 'غير معروف'));
              const directory = this.store.getPaths(id).images;
              if (!directory) throw new Error('مجلد الوسائط المحلية غير متاح لهذه الجلسة.');
              fs.mkdirSync(directory, { recursive: true });
              const filename = uniqueFileName(directory, type === 'sticker' ? 'sticker' : (path.parse(original).name || type || 'media'), ext);
              fs.writeFileSync(safePath(directory, filename), bytes, { mode: 0o600, flag: 'wx' });
              const fresh = this.session(id);
              fresh.ownerAssistant.recent.push({ at: new Date().toISOString(), type: 'owner-media-saved', filename, mimetype: mime, bytes: bytes.length });
              this.save(fresh);
              return { filename, mimetype: mime, bytes: bytes.length, isSticker: type === 'sticker' };
            }
            async promptSavedMediaPicker(id, session) {
              const flow = session.ownerAssistant?.flow, data = flow?.data || {};
              if (!flow || flow.type !== 'send-media') return false;
              const files = typeof this.delivery?.files === 'function' ? this.delivery.files(id) : [];
              if (!files.length) {
                session.ownerAssistant.flow = null; this.save(session);
                await this.reply(id, 'لا توجد ملفات محفوظة قابلة للإرسال. أرسل صورة أو ستيكر أو ملفًا إلى محادثة النفس أولًا؛ سيُحفظ محليًا لتختاره.');
                return false;
              }
              const requested = normalize(data.requestedName || '');
              const exact = requested ? files.filter(f => normalize(f.filename) === requested || normalize(f.id) === requested) : [];
              const partial = requested && !exact.length ? files.filter(f => normalize(f.filename).includes(requested)) : [];
              const matches = exact.length ? exact : partial;
              if (matches.length === 1) {
                const file = matches[0];
                data.file = { id: file.id, filename: file.filename, ext: file.ext, size: file.size, isImage: file.isImage, isVideo: file.isVideo, isAudio: file.isAudio };
                data.asSticker = data.asSticker || /^sticker_/i.test(file.filename);
                flow.step = 'confirm'; this.save(session);
                await this.reply(id, 'مراجعة الملف قبل الإرسال:\nإلى: ' + data.target.label + '\nالملف: ' + file.filename + ' (' + Math.ceil(Number(file.size || 0) / 1024) + ' KB)\n' + (data.asSticker ? 'سيُرسل كستيكر.' : file.isImage ? 'سيُرسل كصورة.' : file.isVideo ? 'سيُرسل كفيديو.' : file.isAudio ? 'سيُرسل كملف صوتي.' : 'سيُرسل كمستند.') + '\nاكتب «تأكيد الإرسال» أو «هو ده»، أو «إلغاء».');
                return true;
              }
              flow.step = 'choose-file'; this.save(session);
              const listing = files.map((f, i) => (i + 1) + '. ' + f.filename + ' — ' + Math.ceil(Number(f.size || 0) / 1024) + ' KB — ' + (f.isImage ? 'صورة' : f.isVideo ? 'فيديو' : f.isAudio ? 'صوت' : 'ملف')).join('\n');
              await this.reply(id, 'اختر الملف لإرساله إلى «' + data.target.label + '» بكتابة رقمه أو اسمه كاملًا:\n' + listing + (requested ? '\nلم أجد تطابقًا وحيدًا مع «' + data.requestedName + '». اختر من القائمة.' : '') + '\nبعد الاختيار سأعرض الملف للتأكيد قبل الإرسال.');
              return true;
            }
          '''
              if marker not in text: raise SystemExit("Missing saved-media method marker")
              text = text.replace(marker, methods + marker, 1)
              marker = "    if (/(?:ارسل|ابعث|ابعت|ارسال|ابعاث).*(?:رساله|رسالة)|^(?:ارسل رسالة|ابعت رسالة|ارسال رساله)$/u.test(p)) {"
              command = r'''    const mediaRequest = p.match(/^(?:ارسل|ابعث|ابعت|ابعثلي|ابعتلي)\s+(?:من\s+)?(?:الملفات المحفوظه|الملفات المحفوظة|الوسائط|الملفات|الملف|ملف|الصوره|صوره|الصورة|صورة|ستيكر|ملصق)(?:\s+(.+))?$/u);
              if (mediaRequest) {
                let requestedName = String(mediaRequest[1] || '').trim(), targetQuery = '';
                const parts = requestedName.match(/^(?:(.*?)\s+)?(?:الى|ل)\s+(.+)$/u);
                if (parts) { requestedName = String(parts[1] || '').trim(); targetQuery = String(parts[2] || '').trim(); }
                assistant.flow = { type: 'send-media', step: 'target', data: { requestedName, targetQuery, asSticker: /ستيكر|ملصق/u.test(p) } };
                if (targetQuery) {
                  try {
                    assistant.flow.data.target = await this.resolveTarget(s, targetQuery);
                    assistant.flow.step = 'choose-file'; this.save(s);
                    await this.promptSavedMediaPicker(id, s);
                  } catch (error) {
                    assistant.flow.step = 'target'; assistant.flow.data.targetQuery = '';
                    this.save(s);
                    await this.reply(id, error.message + '\nاكتب اسم المستلم المحفوظ ثم اختر الملف. اكتب «إلغاء» للتراجع.');
                  }
                } else {
                  this.save(s);
                  await this.reply(id, requestedName ? 'سأبحث عن «' + requestedName + '». لمن تريد إرساله؟ اكتب اسم المستلم المحفوظ.' : 'لمن تريد إرسال الملف المحفوظ؟ اكتب اسم الشخص أو المجموعة المحفوظة، وبعدها سأعرض الملفات للاختيار.');
                }
                return { handled: true, action: 'send-saved-media-started' };
              }
              '''
              if marker not in text: raise SystemExit("Missing send command marker")
              text = text.replace(marker, command + marker, 1)
              marker = "    if (flow.type === 'send-message') {"
              flow = r'''    if (flow.type === 'send-media') {
              const data = flow.data || {};
              if (flow.step === 'target') {
                try {
                  data.target = await this.resolveTarget(session, data.targetQuery || value);
                  flow.step = 'choose-file'; this.save(session);
                  await this.promptSavedMediaPicker(id, session);
                } catch (error) { await this.reply(id, error.message + '\nاكتب اسم مستلم محفوظ أو «إلغاء».'); }
                return true;
              }
              if (flow.step === 'choose-file') {
                const files = typeof this.delivery?.files === 'function' ? this.delivery.files(id) : [];
                const wanted = normalize(value), number = /^\d{1,5}$/u.test(value) ? Number(value) : 0;
                const file = number >= 1 && number <= files.length ? files[number - 1] : files.find(item => normalize(item.filename) === wanted || normalize(item.id) === wanted);
                if (!file) { await this.reply(id, 'لم أتعرف على الاختيار. اكتب رقمًا من 1 إلى ' + files.length + ' أو اسم الملف كاملًا، أو «إلغاء».'); return true; }
                data.file = { id: file.id, filename: file.filename, ext: file.ext, size: file.size, isImage: file.isImage, isVideo: file.isVideo, isAudio: file.isAudio };
                data.asSticker = data.asSticker || /^sticker_/i.test(file.filename);
                flow.step = 'confirm'; this.save(session);
                await this.reply(id, 'مراجعة الملف قبل الإرسال:\nإلى: ' + data.target.label + '\nالملف: ' + file.filename + ' (' + Math.ceil(Number(file.size || 0) / 1024) + ' KB)\nاكتب «تأكيد الإرسال» أو «هو ده» للتنفيذ، أو «إلغاء».');
                return true;
              }
              if (flow.step === 'confirm') {
                if (!/^(?:تاكيد الارسال|هو ده|ده هو|تمام|نعم|موافق|confirm|ok)$/u.test(p)) {
                  await this.reply(id, 'لم أرسل الملف بعد. اكتب «تأكيد الإرسال» أو «هو ده»، أو «إلغاء».'); return true;
                }
                try {
                  const fresh = this.session(id), files = typeof this.delivery?.files === 'function' ? this.delivery.files(id) : [];
                  const file = files.find(item => item.id === data.file?.id && item.filename === data.file?.filename);
                  if (!file) throw new Error('الملف لم يعد موجودًا في المكتبة؛ أعد الاختيار.');
                  const target = await this.resolveTarget(fresh, String(data.target?.label || ''));
                  const fullPath = safePath(this.store.getPaths(id).images, file.filename);
                  if (!fs.existsSync(fullPath) || !fs.statSync(fullPath).isFile()) throw new Error('الملف غير موجود محليًا، ولم يتم الإرسال.');
                  const asSticker = Boolean(data.asSticker && /\.webp$/i.test(file.filename));
                  const asDocument = !asSticker && !file.isImage && !file.isVideo && !file.isAudio;
                  const result = await this.whatsapp.sendMedia(id, target.chatId, fullPath, { asDocument, asSticker });
                  const latest = this.session(id);
                  latest.ownerAssistant.flow = null;
                  latest.ownerAssistant.recent.push({ at: new Date().toISOString(), type: 'send-saved-media', target: target.label, filename: file.filename, asSticker });
                  this.save(latest);
                  await this.reply(id, 'تم تمرير «' + file.filename + '» إلى WhatsApp لإرساله إلى «' + target.label + '». الحالة: ' + (result?.__chatBotAck?.status || 'قبول الإرسال') + '.');
                } catch (error) {
                  const latest = this.session(id); latest.ownerAssistant.flow = null; this.save(latest);
                  await this.reply(id, 'تعذر إرسال الملف: ' + String(error?.message || error).slice(0, 500) + '\nلم تتم إعادة المحاولة تلقائيًا لتجنب التكرار.');
                }
                return true;
              }
            }
            '''
              if marker not in text: raise SystemExit("Missing send-message flow marker")
              return text.replace(marker, flow + marker, 1)
          edit("src/owner-assistant.js", patch_owner)

          def patch_whatsapp_media(text):
              old = "async sendMedia(id, chatId, file, { timeoutMs = 30000, asDocument = false, caption = '' } = {}) {"
              new = "async sendMedia(id, chatId, file, { timeoutMs = 30000, asDocument = false, asSticker = false, caption = '' } = {}) {"
              if old not in text: raise SystemExit("Missing sendMedia signature")
              text = text.replace(old, new, 1)
              old = "    const mediaOptions = { sendMediaAsDocument: Boolean(asDocument) };"
              new = "    if (asSticker && path.extname(file).toLowerCase() !== '.webp') throw new Error('إرسال الملصق يتطلب ملف WebP.');\n    const mediaOptions = { sendMediaAsDocument: Boolean(asDocument), ...(asSticker ? { sendMediaAsSticker: true } : {}) };"
              if old not in text: raise SystemExit("Missing media options block")
              return text.replace(old, new, 1)
          edit("src/whatsapp.js", patch_whatsapp_media)

          if "test/recipient-paused.js" not in members:
              members["test/recipient-paused.js"] = r'''const assert = require('node:assert/strict');
            const { recipientIsPaused } = require('../src/recipient-replies');
            const session = {
              recipients: [
                { id: 'x', name: 'Disabled by phone', e164: '+96890001111', enabled: false },
                { id: 'y', name: 'Paused LID', digits: '96890002222', jid: '96890002222@c.us', enabled: true, paused: true },
                { id: 'z', name: 'Running', digits: '96890003333', enabled: true }
              ],
              groups: [{ id: 'g1', name: 'Muted group', gid: '120363000000001@g.us', enabled: false }]
            };
            assert.equal(recipientIsPaused(session, '96890001111@c.us'), true);
            assert.equal(recipientIsPaused(session, '96890002222@lid'), true);
            assert.equal(recipientIsPaused(session, '120363000000001@g.us'), true);
            assert.equal(recipientIsPaused(session, '96890003333@c.us'), false);
            assert.equal(recipientIsPaused(session, '96890004444@c.us'), false);
            console.log('recipient-paused: ok');
            '''
          # Exercise the owner saved-media flow using a temporary local media library.
          members["test/owner-media-send.js"] = r'''const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const { OwnerAssistant } = require('../src/owner-assistant');
          const { scanImages } = require('../src/media');

          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'owner-media-send-'));
          const images = path.join(root, 'images');
          fs.mkdirSync(images, { recursive: true });
          let session = {
            id: 'main', name: 'test',
            recipients: [{ id: 'ahmed', name: 'أحمد', digits: '96891111111', e164: '+96891111111', enabled: true }],
            groups: [], settings: { maxImageSizeMB: 20 }, interaction: { rules: [] },
            automation: { tasks: [], rules: [] }, stats: {}, cycle: {},
            ownerAssistant: { flow: null, recent: [] }
          };
          const clone = value => JSON.parse(JSON.stringify(value));
          const store = {
            safeSessionId: value => String(value || 'main'),
            loadSession: () => clone(session),
            saveSession: value => { session = clone(value); return clone(session); },
            getPaths: () => ({ dir: root, images })
          };
          const replies = [], sends = [];
          const whatsapp = {
            selfChatId: () => '96890000000@c.us',
            sendText: async (_id, _chat, body) => { replies.push(String(body)); return { __chatBotAck: { status: 'confirmed' } }; },
            sendMedia: async (_id, chatId, file, options) => { sends.push({ chatId, file, options }); return { __chatBotAck: { status: 'confirmed' } }; }
          };
          const delivery = { files: () => scanImages(images, 20).files };
          (async () => {
            const owner = new OwnerAssistant({ store, whatsapp, phones: { parse: () => ({}) }, log: () => {}, delivery });
            owner.resolveTarget = async (_session, value) => {
              assert.ok(/احمد/i.test(String(value)), 'recipient name should be resolved from the owner selection');
              return { label: 'أحمد', chatId: '96891111111@c.us', key: 'r:ahmed' };
            };
            const encoded = Buffer.from('fake-webp-sticker-bytes').toString('base64');
            const saved = await owner.rememberIncomingMedia('main', {
              hasMedia: true, type: 'sticker',
              _data: { mimetype: 'image/webp', filename: 'sticker.webp' },
              downloadMedia: async () => ({ data: encoded, mimetype: 'image/webp', filename: 'sticker.webp' })
            });
            assert.ok(saved.filename.endsWith('.webp'));
            assert.ok(fs.existsSync(path.join(images, saved.filename)));

            await owner.handleSelfChatMessage('main', { body: 'ارسل من الملفات المحفوظة إلى أحمد' });
            assert.equal(session.ownerAssistant.flow.type, 'send-media');
            assert.equal(session.ownerAssistant.flow.step, 'choose-file');
            assert.equal(sends.length, 0, 'media must not be sent before a file is chosen and confirmed');
            await owner.handleSelfChatMessage('main', { body: '1' });
            assert.equal(session.ownerAssistant.flow.step, 'confirm');
            assert.equal(sends.length, 0, 'selecting the file alone must not send it');
            await owner.handleSelfChatMessage('main', { body: 'هو ده' });
            assert.equal(sends.length, 1, 'the explicit owner confirmation should send the chosen item once');
            assert.equal(sends[0].chatId, '96891111111@c.us');
            assert.equal(sends[0].options.asSticker, true);
            assert.equal(sends[0].options.asDocument, false);
            assert.equal(session.ownerAssistant.flow, null);
            console.log('owner-media-send: ok (save owner sticker locally, choose saved file, require explicit send confirmation)');
          })().catch(error => { console.error(error); process.exitCode = 1; })
            .finally(() => fs.rmSync(root, { recursive: true, force: true }));
          '''
          with tempfile.NamedTemporaryFile(prefix="repaired-", suffix=".zip", dir=".", delete=False) as handle:
              output_path = Path(handle.name)
          try:
              with ZipFile(output_path, "w", ZIP_DEFLATED, compresslevel=6) as dest:
                  for name in sorted(members):
                      dest.writestr(name, members[name])
              os.replace(output_path, archive)
          finally:
              if output_path.exists():
                  output_path.unlink()
          print("Patched files:", ", ".join(sorted(patched)) if patched else "(no text changes needed)")
          print("Archive entries:", len(members), "bytes:", archive.stat().st_size)
          PY
